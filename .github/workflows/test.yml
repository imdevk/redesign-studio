name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser tests need Chromium; without it they are skipped.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
